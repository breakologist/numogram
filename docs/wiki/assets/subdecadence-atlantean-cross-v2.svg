<text x="450" y="712" fill="#64748b" font-size="8" text-anchor="middle">light 9 · dark 0</text>
<text x="30" y="835" fill="#64748b" font-size="9">Rules [ccru.net Matrix]: Subdecadence = 40 cards (A–9 + four Queens = 0); pairs sum to 9.</text>
<text x="30" y="850" fill="#64748b" font-size="9">Each pair scores its difference; unpaired Set-1 cards score minus face value.</text>
<text x="30" y="865" fill="#64748b" font-size="9">An Aeon lasts until the first negative result; negative totals call demons by mesh number.</text>
<text x="30" y="880" fill="#64748b" font-size="9">Pylon ↔ zone mapping: repo zones.ts "centauri" field (from ccru.net zone pages).</text>
