<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="Subdecadence Atlantean Cross — the five-spread with 9-sum pairing lines and Tokhatto as Governor">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arr-center" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0,0 6,2 0,4" fill="#e11d48"/></marker>
    <marker id="arr-east"  markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0,0 6,2 0,4" fill="#a78bfa"/></marker>
    <marker id="arr-west"  markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0,0 6,2 0,4" fill="#38bdf8"/></marker>
    <marker id="arr-north" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0,0 6,2 0,4" fill="#fbbf24"/></marker>
    <marker id="arr-south" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0,0 6,2 0,4" fill="#34d399"/></marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="44" font-size="22" fill="#e2e8f0" font-weight="bold" text-anchor="middle" font-family="monospace">ATLANTEAN CROSS — SUBDECADENCE SPREAD</text>
  <text x="400" y="68" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="monospace">Pairs sum to 9 · Governed by Tokhatto · 45 demons in the matrix</text>

  <!-- Central Hub -->
  <circle cx="400" cy="460" r="56" fill="#162032" stroke="#e11d48" stroke-width="2.5"/>
  <text x="400" y="450" font-size="16" fill="#e11d48" text-anchor="middle" font-weight="bold" font-family="monospace">I · CENTER</text>
  <text x="400" y="470" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="monospace">Memories &amp; Dreams</text>
  <text x="400" y="490" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">5-sum (self-decadence 5::5)</text>

  <!-- Cross Arms -->
  <!-- West -->
  <line x1="344" y1="460" x2="140" y2="460" stroke="#334155" stroke-width="1.5"/>
  <circle cx="140" cy="460" r="46" fill="#162032" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="140" y="450" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="bold" font-family="monospace">II · WEST</text>
  <text x="140" y="470" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="monospace">Destruction</text>
  <text x="140" y="490" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">4+5 → +1 current 1</text>

  <!-- East -->
  <line x1="456" y1="460" x2="660" y2="460" stroke="#334155" stroke-width="1.5"/>
  <circle cx="660" cy="460" r="46" fill="#162032" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="660" y="450" font-size="15" fill="#a78bfa" text-anchor="middle" font-weight="bold" font-family="monospace">III · EAST</text>
  <text x="660" y="470" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="monospace">Creation</text>
  <text x="660" y="490" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">3+6 → +3 current 3</text>

  <!-- North -->
  <line x1="400" y1="404" x2="400" y2="210" stroke="#334155" stroke-width="1.5"/>
  <circle cx="400" cy="210" r="46" fill="#162032" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="400" y="200" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold" font-family="monospace">IV · NORTH</text>
  <text x="400" y="220" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="monospace">Far Future</text>
  <text x="400" y="240" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">1+8 → +7 current 7</text>

  <!-- South -->
  <line x1="400" y1="516" x2="400" y2="710" stroke="#334155" stroke-width="1.5"/>
  <circle cx="400" cy="710" r="46" fill="#162032" stroke="#34d399" stroke-width="2.5"/>
  <text x="400" y="700" font-size="15" fill="#34d399" text-anchor="middle" font-weight="bold" font-family="monospace">V · SOUTH</text>
  <text x="400" y="720" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="monospace">Deep Past</text>
  <text x="400" y="740" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">2+7 → +5 current 5</text>

  <!-- Surrounding Pair Ring (9-sum completion) -->
  <g font-family="monospace" font-size="11">
    <!-- 0+9 -->
    <circle cx="260" cy="340" r="28" fill="#0f172a" stroke="#e2e8f0" stroke-width="1"/>
    <text x="260" y="334" fill="#e2e8f0" text-anchor="middle">0 + 9</text>
    <text x="260" y="350" fill="#94a3b8" text-anchor="middle">= 9 → +9</text>
    <!-- 1+8 -->
    <circle cx="540" cy="340" r="28" fill="#0f172a" stroke="#e2e8f0" stroke-width="1"/>
    <text x="540" y="334" fill="#e2e8f0" text-anchor="middle">1 + 8</text>
    <text x="540" y="350" fill="#94a3b8" text-anchor="middle">= 9 → +7</text>
    <!-- 2+7 -->
    <circle cx="220" cy="580" r="28" fill="#0f172a" stroke="#e2e8f0" stroke-width="1"/>
    <text x="220" y="594" fill="#e2e8f0" text-anchor="middle">2 + 7</text>
    <text x="220" y="578" fill="#94a3b8" text-anchor="middle">= 9 → +5</text>
    <!-- 3+6 -->
    <circle cx="580" cy="580" r="28" fill="#0f172a" stroke="#e2e8f0" stroke-width="1"/>
    <text x="580" y="594" fill="#e2e8f0" text-anchor="middle">3 + 6</text>
    <text x="580" y="578" fill="#94a3b8" text-anchor="middle">= 9 → +3</text>
    <!-- 4+5 -->
    <circle cx="400" cy="820" r="28" fill="#0f172a" stroke="#e2e8f0" stroke-width="1"/>
    <text x="400" y="814" fill="#e2e8f0" text-anchor="middle">4 + 5</text>
    <text x="400" y="830" fill="#94a3b8" text-anchor="middle">= 9 → +1</text>
  </g>

  <!-- Pair lines from center outward (illustrative) -->
  <g stroke-width="1" stroke-dasharray="4 3" opacity="0.45">
    <line x1="360" y1="420" x2="284" y2="354" stroke="#e11d48" marker-end="url(#arr-center)"/>
    <line x1="440" y1="420" x2="516" y2="354" stroke="#a78bfa" marker-end="url(#arr-east)"/>
    <line x1="360" y1="500" x2="284" y2="566" stroke="#38bdf8" marker-end="url(#arr-west)"/>
    <line x1="440" y1="500" x2="516" y2="566" stroke="#34d399" marker-end="url(#arr-south)"/>
    <line x1="400" y1="404" x2="400" y2="264" stroke="#fbbf24" marker-end="url(#arr-north)"/>
  </g>

  <!-- Tokhatto Governor Seal -->
  <rect x="272" y="790" width="256" height="64" rx="10" fill="#162032" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="818" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold" font-family="monospace">TOKHATTO · Old Toker</text>
  <text x="400" y="836" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="monospace">5::0 · Amphidemon of Talismania</text>
  <text x="400" y="850" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">Mesh #10 · Current Hold (c=5)</text>

  <!-- Footer equation -->
  <text x="400" y="882" font-size="11" fill="#64748b" text-anchor="middle" font-family="monospace">∑(hand ↔ cross) = score ≥ 0 → aeon continues · &lt; 0 → Tokhatto claims the mesh</text>
</svg>
