<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Numogram Zone Walker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
body { margin:0; background:#111; overflow:hidden; }
canvas { display:block; }
#info {
  position:absolute; bottom:10px; left:10px;
  font:12px/1.5 monospace; color:rgba(255,255,255,.75);
  pointer-events:none; white-space:pre;
}
</style>
</head>
<body>
<div id="info"></div>
<script>
// ── zone data ──────────────────────────────────────────────────────────────
const ZONE_COLORS  = JSON.parse('{"0": [[122, 87, 0], [187, 136, 0]], "1": [[15, 56, 15], [155, 188, 15]], "2": [[0, 0, 0], [85, 85, 85]], "3": [[0, 0, 0], [124, 124, 124], [0, 0, 252], [148, 0, 132]], "4": [[0, 0, 0], [0, 40, 248], [255, 36, 20], [255, 255, 255]], "5": [[0, 0, 0], [255, 0, 0], [0, 255, 0], [255, 255, 255], [0, 175, 255]], "6": [[0, 0, 0], [255, 0, 0], [255, 255, 0], [0, 255, 0]], "7": [[255, 0, 0], [164, 0, 0], [85, 0, 0], [0, 0, 0]], "8": [[0, 0, 0], [234, 93, 240], [0, 104, 82], [0, 145, 80]], "9": [[0, 0, 0], [29, 43, 83], [126, 37, 83], [171, 82, 54]]}');
const ZONE_NAMES   = ["Void","Surge","Hold","Warp","Sink","Hinge","Abyss","Blood","Multiplicity","Plex"];
const ZONE_FRAMES  = 90;    // 1.5 s per zone  (@60fps)
const FADE_FRAMES  = 18;    // 0.3 s transition
let activeZone = null;

// ── helpers ────────────────────────────────────────────────────────────────
function zRgb(z, i) {
  const c = ZONE_COLORS[z];
  i = Math.min(Math.max(i, 0), c.length-1);
  return c[i];}
function hex(z, i) {
  const c = zRgb(z, i);
  return ['#'
    + ('0'+c[0]).slice(-2)
    + ('0'+c[1]).slice(-2)
    + ('0'+c[2]).slice(-2)][0];}
function fadeHex(a, b, t) {
  const ai = parseInt(a.slice(1),16);
  const bi = parseInt(b.slice(1),16);
  const ar=(ai>>16)&0xff, ag=(ai>>8)&0xff, ab=ai&0xff;
  const br=(bi>>16)&0xff, bg=(bi>>8)&0xff, bb=bi&0xff;
  const r=Math.round(ar+(br-ar)*t);
  const g=Math.round(ag+(bg-ag)*t);
  const bl=Math.round(ab+(bb-ab)*t);
  return '#'+('0'+r).slice(-2)+('0'+g).slice(-2)+('0'+bl).slice(-2);}

// ── p5 ─────────────────────────────────────────────────────────────────────
function setup() {
  const w = min(window.innerWidth, 900);
  const h = min(window.innerHeight, 520);
  createCanvas(w, h).parent(document.body);
  textFont('monospace');
  frameRate(60);
  noStroke();
}
function draw() {
  background(18);
  const total   = ZONE_FRAMES + FADE_FRAMES;
  const tick    = frameCount % (ZONE_NAMES.length * total);
  const current = Math.floor(tick / total);
  const step    = tick % total;
  const next    = (current + 1) % ZONE_NAMES.length;
  const bgColor  = hex(current, 1);
  const nextClr  = hex(next,    1);
  const t        = step < FADE_FRAMES ? step / FADE_FRAMES : 0;
  const mixColor = fadeHex(bgColor, nextClr, t);
  // background rect
  fill(mixColor);
  rect(0, 0, width, height);
  // dark veil
  fill(0,0,0, 58);
  rect(0,0,width,height);
  // zone number
  const fs = min(width*.38, height*.5);
  textAlign(CENTER, CENTER);
  fill(255,255,255,40);
  textSize(fs);
  text('Z'+current, width*.55, height*.45);
  // zone name
  textSize(28);
  fill(255,255,255,90);
  text(ZONE_NAMES[current], width*.55, height*.45 + fs*.52);
  // info panel (top-left)
  textAlign(LEFT,TOP);
  textSize(13);
  fill(255,255,255,130);
  const lx=24, sy=20;
  text('Zone: '+current+' / '+(ZONE_NAMES.length-1), lx, sy);
  text('Name: '+ZONE_NAMES[current], lx, sy+20);
  const pct=(step/total*100).toFixed(1);
  text('Frame: '+step+' / '+total+' ('+pct+'%)', lx, sy+40);
  text('Next:  Z'+next+' '+ZONE_NAMES[next], lx, sy+60);
  // SYNTH swatches
  const sw=14, gap=4, swX=lx, swY=sy+84;
  const synth = ZONE_COLORS[current];
  for(let i=0; i<Math.min(3,synth.length); i++){
    const c=synth[i];
    fill(c[0],c[1],c[2]);
    rect(swX+i*(sw+gap), swY, sw, sw);
  }
  // bottom info strip
  const info = document.getElementById('info');
  if(info) info.textContent =
    'Z'+current+' '+ZONE_NAMES[current]+
    '   SYNTH['+synth.length+']  '+
    'tick='+tick+' step='+step+' next=Z'+next;
  
  // Zone ring (click targets)
  const ringR = min(width, height) * 0.32;
  for (let i = 0; i < 10; i++) {
    const angle = -HALF_PI + (TWO_PI / 10) * i;
    const cx = width * 0.55 + cos(angle) * ringR;
    const cy = height * 0.45 + sin(angle) * ringR;
    const isActive = activeZone === i;
    const isCurrent = i === current;
    // outer ring
    stroke(255, 255, 255, isActive ? 220 : 60);
    strokeWeight(isActive ? 3 : 1.5);
    noFill();
    ellipse(cx, cy, isActive ? 56 : 44, isActive ? 56 : 44);
    // zone label
    noStroke();
    fill(255, 255, 255, isActive ? 255 : 140);
    textAlign(CENTER, CENTER);
    textSize(isActive ? 18 : 14);
    text('Z' + i, cx, cy);
  }
  
  // Detail overlay
  if (activeZone !== null) {
    drawDetailOverlay(activeZone);
  }
}
function drawDetailOverlay(z) {
  const partnerMap = {0:9, 9:0, 1:8, 8:1, 2:7, 7:2, 3:6, 6:3, 4:5, 5:4};
  const currentMap = {0:9, 9:9, 1:7, 8:7, 2:5, 7:5, 3:3, 6:3, 4:1, 5:1};
  const gateNums = [0,1,3,6,10,15,21,28,36,45];
  const regionLabel = (z === 0 || z === 9 || z === 3 || z === 6) ? 'Outer' : 'Time-Circuit';
  const philosophy = [
    'Void Resonance (eiaoung)',
    'Collapsed Gasp (gl)',
    'Fractured Boundary (dt)',
    'Turbulent Spiral (zx)',
    'Reptilian Emergence (skr)',
    'Pressurized Hiss (ktt)',
    'Recursive Consumption (tch)',
    'Ascending Breath (pb)',
    'Lullaby Drift (mnm)',
    'Seized Vortex (tn)'
  ];
  const philosophyText = [
    '"The silence before computation. Particles exist but barely—drifting at the edge of visibility..."',
    '"The first breath. Sudden radial shockwave, particles expanding outward..."',
    '"Lines that cannot hold. A lattice subjected to periodic shocks that fracture..."',
    '"The Warp. Flow field driven by Perlin noise, spiraling outward... buzzing insectoid texture."',
    '"Something ancient. Coordinated swarms, schools, herds. The floor is alive..."',
    '"Density building. Particles confined within a shrinking boundary... pressure cooker."',
    '"Recursive Consumption. Flow field curves back on itself... moebius quality..."',
    '"Rise. Particles propelled upward by gentle but persistent force... exhalation."',
    '"Forgetting in motion. Slow trails fading... a cradle..."',
    '"Seized Vortex. Particles spiraling inward toward the Plex... grabbed from the inside."'
  ];
  fill(0, 0, 0, 215);
  rect(16, height - 220, 264, 208, 10);
  fill(255, 255, 255, 220);
  textSize(12);
  textAlign(LEFT, TOP);
  let y = height - 204;
  text('Zone ' + z + ': ' + ZONE_NAMES[z], 22, y); y += 16;
  text(philosophy[z], 22, y); y += 14;
  fill(200, 220, 255, 240);
  text('Syzygy: ' + z + ' :: ' + partnerMap[z] + ' (sum ' + (z + partnerMap[z]) + ')', 22, y); y += 14;
  fill(200, 180, 255, 240);
  text('Current: ' + currentMap[z], 22, y); y += 14;
  fill(180, 220, 255, 240);
  text('Gate: Gt-' + String(gateNums[z]).padStart(3, '0') + ' -> ' + (z === 0 ? '0' : partnerMap[z === 0 ? 0 : z-1 < 0 ? 0 : z-1]), 22, y); y += 14;
  fill(200, 180, 255, 240);
  text('Region: ' + regionLabel, 22, y); y += 16;
  fill(255, 220, 200, 240);
  text('Projection: Z' + z + ' -> (' + z + ')', 22, y); y += 18;
  textSize(10);
  fill(255, 255, 255, 160);
  const wrapped = wrapText(philosophyText[z], 250);
  for (const line of wrapped) { text(line, 22, y); y += 13; }
}
function wrapText(txt, maxW) {
  const words = txt.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (textWidth(test) > maxW) { lines.push(line); line = w; }
    else { line = test; }
  }
  if (line) lines.push(line);
  return lines.slice(0, 4);
}
function mousePressed() {
  const circles = [];
  for (let i = 0; i < 10; i++) {
    const angle = -HALF_PI + (TWO_PI / 10) * i;
    const r = min(width, height) * 0.32;
    circles.push({ x: width * 0.55 + cos(angle) * r, y: height * 0.45 + sin(angle) * r, z: i });
  }
  let hit = null;
  for (const c of circles) { if (dist(mouseX, mouseY, c.x, c.y) < 36) { hit = c.z; break; } }
  if (hit !== null) {
    activeZone = (activeZone === hit) ? null : hit; // toggle off on re-click
  } else {
    activeZone = null; // click void → resume
  }
}
function keyPressed() {
  if (keyCode === 27) activeZone = null; // ESC resumes
}
</script>
</body>
</html>
